<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>分类刷题 · 面试准备</title>
<link rel="stylesheet" href="../assets/style.css">
</head>
<body data-page="quiz">
<div id="topbar" data-base="../"></div>
<div style="height:3px;background:transparent"><i id="read-bar" style="display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--purple))"></i></div>

<div class="wrap">
  <div class="quiz-shell">
    <div class="quiz-top">
      <div>
        <h1 style="margin:0 0 6px">分类刷题</h1>
        <p style="margin:0;color:var(--text-dim);font-size:14px" id="quiz-sub">
          选一个专题开始。答错自动进错题本，每题都可点「看解析」看答案与理由。
        </p>
      </div>
      <div class="pill-row" id="cat-pills"></div>
    </div>

    <div class="progress-line"><i id="qp-bar"></i></div>
    <div class="progress-meta"><span id="qp-left">—</span><span id="qp-right"></span></div>

    <div id="quiz-body"><div class="empty">正在加载题库…</div></div>

    <p style="margin-top:34px;font-size:12.5px;color:var(--text-faint);text-align:center">
      快捷键：<code>1</code>–<code>4</code> 或 <code>A</code>–<code>D</code> 选择，<code>←</code> <code>→</code> 切题；不想作答可点「看解析」直接看答案
    </p>
    <p style="margin-top:10px;font-size:12px;color:var(--text-faint);text-align:center">
      本目录可整体下载，直接双击 <code>index.html</code> 离线使用。错题本存在浏览器本地。
    </p>
  </div>
</div>

<script src="../assets/app.js"></script>
<script src="data/bundle.js"></script>
<script src="quiz.js"></script>
</body>
</html>
